<!-- one frame for every kind: the same look as a card (border, round corners), so a tile and a picture card sit in one grid; what is inside is the kind's own -->
<div class="card h-100" [class.feed-pressable]="pressable()" [attr.role]="pressable() ? 'link' : null" [attr.tabindex]="pressable() ? 0 : null" (click)="pressable() && press()" (keydown.enter)="pressable() && press()">
  <div class="card-body d-flex flex-column gap-1">
    @if (offer(); as o) {
      <!-- an offer: a mark that catches the eye, the title and the words -->
      <span class="badge text-bg-warning align-self-start"><i class="bi bi-tag-fill" aria-hidden="true"></i> {{ o.label }}</span>
      <div class="subsection-title">{{ o.title }}</div>
      @if (o.text) {
        <div class="small text-body-secondary">{{ o.text }}</div>
      }
    } @else if (pack(); as k) {
      <!-- a package: a box, the title, the words and how many pictures it holds -->
      <i class="bi bi-box-seam icon-xl text-primary" aria-hidden="true"></i>
      <div class="subsection-title">{{ k.title }}</div>
      @if (k.text) {
        <div class="small text-body-secondary">{{ k.text }}</div>
      }
      <div class="tiny text-body-secondary mt-auto"><i class="bi bi-images" aria-hidden="true"></i> {{ k.jigsawIds.length }}</div>
    } @else if (info(); as i) {
      <!-- information: words to read -->
      <i class="bi bi-info-circle-fill icon-xl text-primary" aria-hidden="true"></i>
      <div class="subsection-title">{{ i.title }}</div>
      <div class="small text-body-secondary">{{ i.text }}</div>
    }
  </div>
</div>
