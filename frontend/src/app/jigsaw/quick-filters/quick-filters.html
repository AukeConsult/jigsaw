<ng-container *transloco="let t">
  <div class="quick-filters d-flex flex-wrap gap-2" role="group" [attr.aria-label]="t('jigsawList.quickFilters') || 'Quick filters'">
    <button type="button" class="btn btn-sm rounded-pill" [class.btn-primary]="all()" [class.btn-outline-secondary]="!all()" [attr.aria-pressed]="all()" (click)="showAll()">{{ t('jigsawList.all') || 'All' }}</button>
    @if (showFavorites()) {
      <!-- only when the user has favorites: the jigsaws ticked with a heart -->
      <button type="button" class="btn btn-sm rounded-pill" [class.btn-primary]="favoritesOn()" [class.btn-outline-secondary]="!favoritesOn()" [attr.aria-pressed]="favoritesOn()" [attr.aria-label]="t('jigsawList.favorites') || 'Favorites'" [title]="t('jigsawList.favorites') || 'Favorites'" (click)="toggleFavorites()">
        <i class="bi" [class]="favoritesOn() ? 'bi-heart-fill' : 'bi-heart'" aria-hidden="true"></i><span class="d-none d-sm-inline">{{ t('jigsawList.favorites') || 'Favorites' }}</span>
      </button>
    }
    @for (c of categories; track c.key) {
      @let on = chosen(c.key);
      <button type="button" class="btn btn-sm rounded-pill" [class.btn-primary]="on" [class.btn-outline-secondary]="!on" [attr.aria-pressed]="on" [attr.aria-label]="t('jigsawCategories.name.' + c.key) || c.name" [title]="t('jigsawCategories.name.' + c.key) || c.name" (click)="toggle(c.key)">
        <i class="bi" [class]="on ? 'bi-star-fill' : c.icon" aria-hidden="true"></i><span class="d-none d-sm-inline">{{ t('jigsawCategories.name.' + c.key) || c.name }}</span>
      </button>
    }
    <!-- always there: the way to the choices of the search and to how the jigsaws are shown, cards or list (the Find page); it says so in words, except on a phone, where only the icon is shown (the words are for a screen reader and the tooltip) -->
    <a class="btn btn-sm btn-outline-secondary rounded-pill text-nowrap" routerLink="/jigsaw/find" [title]="t('jigsawList.changeSearch') || 'Change the search'" [attr.aria-label]="t('jigsawList.findAndView') || 'Find and view'"><i class="bi bi-search" aria-hidden="true"></i><span class="d-none d-sm-inline">{{ t('jigsawList.findAndView') || 'Find and view' }}</span></a>
    @if (showSolved()) {
      <!-- only when the user has solved some: the jigsaws with the green check -->
      <button type="button" class="btn btn-sm rounded-pill" [class.btn-primary]="solvedOn()" [class.btn-outline-secondary]="!solvedOn()" [attr.aria-pressed]="solvedOn()" [attr.aria-label]="t('jigsawList.solved') || 'Solved'" [title]="t('jigsawList.solved') || 'Solved'" (click)="toggleSolved()">
        <i class="bi" [class]="solvedOn() ? 'bi-check-circle-fill' : 'bi-check-circle'" aria-hidden="true"></i><span class="d-none d-sm-inline">{{ t('jigsawList.solved') || 'Solved' }}</span>
      </button>
    }
  </div>
</ng-container>
