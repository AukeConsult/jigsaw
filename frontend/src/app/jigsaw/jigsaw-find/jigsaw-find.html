<main class="container-fluid page-margin find-page" *transloco="let t">
  <!-- Go is at the top too, so it is there without scrolling down the choices -->
  <div class="d-flex justify-content-between align-items-center gap-2 mb-3">
    <!-- the spinner that turns while the counts are being read is beside the title (it takes its small room all the time, so nothing moves when it turns up and goes; no line of its own at the top) -->
    <div class="d-flex align-items-center gap-2">
      <h1 class="page-title mb-0">{{ t('jigsawList.findTitle') || 'Filter pictures' }}</h1>
      <span class="spinner-border spinner-border-sm text-primary" [class.invisible]="!slow()" [attr.aria-hidden]="!slow()" role="status"><span class="visually-hidden">{{ t('jigsawList.loading') || 'Fetching the jigsaws…' }}</span></span>
    </div>
    <div class="d-flex gap-2">
      <button type="button" class="btn btn-primary" [disabled]="count() === 0" (click)="go()"><i class="bi bi-search" aria-hidden="true"></i>{{ t('jigsawList.go') || 'Go' }}</button>
    </div>
  </div>
  <!-- the choices are in a frame of their own, so they are read on a plain background and not on the soft pattern of the page -->
  <div class="card card-body">
    <app-view-switch [(view)]="view" idPrefix="find-view" />
    <app-jigsaw-filter [(filter)]="filter" [facets]="facets()" idPrefix="find" />
    <div class="mb-3 d-flex flex-wrap gap-2"><button type="button" class="btn btn-primary" [disabled]="count() === 0" (click)="go()"><i class="bi bi-search" aria-hidden="true"></i>{{ t('jigsawList.go') || 'Go' }}</button></div>
  </div>
</main>
