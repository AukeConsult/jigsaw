<ng-container *transloco="let t">
<fieldset class="mb-3">
  <legend class="form-label">{{ t('jigsawNew.visibility') || 'Who sees it' }}</legend>
  <!-- the three choices as a row of pills, the chosen one filled -->
  <div class="d-flex flex-wrap gap-2">
    @if (!publicLocked()) {
      <input id="visibility-everyone" name="visibility" class="btn-check" type="radio" autocomplete="off" [checked]="visibility() === 'everyone'" (change)="visibility.set('everyone')">
      <label class="btn btn-sm btn-outline-primary rounded-pill text-nowrap" for="visibility-everyone"><i class="bi bi-globe2 me-1" aria-hidden="true"></i>{{ t('jigsawNew.visibilityEveryone') || 'Public' }}</label>
    }
    <input id="visibility-owner" name="visibility" class="btn-check" type="radio" autocomplete="off" [checked]="visibility() === 'owner'" [disabled]="!ownerKnown()" (change)="visibility.set('owner')">
    <label class="btn btn-sm btn-outline-primary rounded-pill text-nowrap" for="visibility-owner"><i class="bi bi-lock me-1" aria-hidden="true"></i>{{ t('jigsawNew.visibilityOwner') || 'Private' }}</label>
    <input id="visibility-hidden" name="visibility" class="btn-check" type="radio" autocomplete="off" [checked]="visibility() === 'hidden'" [disabled]="!ownerKnown()" (change)="visibility.set('hidden')">
    <label class="btn btn-sm btn-outline-primary rounded-pill text-nowrap" for="visibility-hidden"><i class="bi bi-eye-slash me-1" aria-hidden="true"></i>{{ t('jigsawNew.visibilityHidden') || 'Hidden' }}</label>
  </div>
</fieldset>
</ng-container>
