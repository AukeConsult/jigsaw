<ng-container *transloco="let t">
  @let name = words().name;
  <div class="card h-100">
    <a [routerLink]="route()" [title]="name" [attr.aria-label]="t('jigsawList.playName', { name: name }) || 'Show ' + name" tabindex="-1">
      <div class="ratio ratio-4x3 bg-body-secondary rounded-top overflow-hidden">
        @if (!noPicture()) {
          <img appArriving class="object-fit-cover" [src]="pictureUrl()" loading="lazy" decoding="async" alt="" (error)="noPicture.set(true)">
        }
      </div>
    </a>
    <!-- what the page puts under the picture (the tiny text of a round) -->
    <div class="px-2 pb-1"><ng-content /></div>
  </div>
</ng-container>
