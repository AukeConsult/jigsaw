<!-- the band of the user's open rounds: stuck to the top while the page scrolls -->
<app-my-rounds (loaded)="roundsLoaded.set(true)" />
<main class="container-fluid page-margin" *transloco="let t">
  <app-start-welcome />

  <!-- all the jigsaws, the newest first (looking for one by category, size and so on is the Find page in the menu) -->
  <section class="mb-4" [attr.aria-label]="t('jigsawHome.jigsaws') || 'Jigsaws'">
    <div class="d-flex flex-wrap align-items-center gap-2 mb-2">
      <!-- everybody knows these are jigsaws: the heading is only for a screen reader -->
      <h2 class="visually-hidden">{{ t('jigsawHome.jigsaws') || 'Jigsaws' }}</h2>
      <!-- a press of a quick filter looks for jigsaws again: it takes the list of rounds away -->
      <app-quick-filters [filter]="filter()" (filterChange)="filter.set($event); roundsOn.set(false)" [muted]="roundsShown()" />
      @if (users.acting()) {
        <!-- at the right end of the line: the rounds the users have played, the person's own too (it needs a user: the API says who asks) -->
        <button type="button" class="btn btn-sm rounded-pill ms-auto" [class.btn-primary]="roundsShown()" [class.btn-outline-secondary]="!roundsShown()" [attr.aria-pressed]="roundsShown()"
                [title]="t('jigsawList.roundsButtonTitle') || 'Show the rounds the players have played'" (click)="roundsOn.set(!roundsOn())">
          <i class="bi" [class]="roundsShown() ? 'bi-people-fill' : 'bi-people'" aria-hidden="true"></i>{{ t('jigsawList.roundsButton') || 'Rounds' }}
        </button>
      }
    </div>
    @if (roundsShown()) {
      <app-all-rounds />
    } @else {
      <app-jigsaw-finder storageKey="jigsaw.front" [(filter)]="filter" [hold]="!roundsLoaded()" />
    }
  </section>
</main>
