<!-- the band of the user's open rounds: stuck to the top while the page scrolls -->
<app-my-rounds [jigsaws]="all()" />
<main class="container py-3" *transloco="let t">
  <app-start-welcome />

  <!-- all the jigsaws, the newest first (looking for one by category, size and so on is the Find page in the menu) -->
  <section class="mb-4" [attr.aria-label]="t('jigsawHome.jigsaws') || 'Jigsaws'">
    <div class="d-flex flex-wrap align-items-center gap-2 mb-2">
      <h2 class="section-title mb-0">{{ t('jigsawHome.jigsaws') || 'Jigsaws' }}</h2>
      <app-quick-filters [(filter)]="filter" />
    </div>
    <app-jigsaw-finder storageKey="jigsaw.front" [(filter)]="filter" />
  </section>
</main>
